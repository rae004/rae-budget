# Force patched transitive deps to clear dev-only audit advisories. pnpm 10+
# reads overrides from this file, not package.json.
overrides:
  # GHSA-4cwx-7wf7-3272 — cross-user info disclosure via cache directives.
  # Pulled in through jsdom -> vitest.
  undici: '>=7.29.0 <8'
  # GHSA-rgw5-rvv9-x895, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p — DoS via
  # unbounded/uncontrolled recursion. Pulled in through eslint -> minimatch.
  brace-expansion: '>=5.0.11'
  # GHSA-2v37-7h3g-55p8 — custom generators can loop indefinitely when size
  # is zero. Pulled in through vite/vitest -> postcss.
  nanoid: '>=3.3.18'
  # GHSA-68fv-2mgg-jv7q — event-loop DoS via crafted source map input.
  # Pulled in through vite/vitest -> postcss -> source-map-js.
  source-map-js: '>=1.2.2'
  # GHSA-4x5r-pxfx-6jf8 — arbitrary file read via sourceMappingURL comment.
  # Dev-only; pulled in through eslint-plugin-react-hooks -> @babel/core.
  '@babel/core': '>=7.29.6'
