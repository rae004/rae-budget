version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
      typescript:
        patterns:
          - "typescript"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      styles:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
          - "autoprefixer"
          - "postcss"
    ignore:
      # typescript-eslint pins peerDependencies.typescript to ">=4.8.4 <6.1.0",
      # so TS 7 crashes ESLint with "Cannot read properties of undefined
      # (reading 'Cjs')". Every TS 7.x PR fails CI until upstream widens that
      # range. Drop this entry when typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version — CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y"
      # if they drift. Keep them in one PR.
      codeql:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - ci
