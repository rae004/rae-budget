version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      styles:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
          - "autoprefixer"
          - "postcss"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
