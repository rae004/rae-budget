[project]
name = "rae-budget-api"
version = "0.2.2"
description = "Budget tracking API for rae-budget"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "alembic>=1.18.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
